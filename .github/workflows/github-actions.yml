name: Test JFrog OIDC Authentication & Publishing

on:
 workflow_dispatch:
 push:
  branches:
   - CDSDO-12301
 pull_request:
  branches:
   - main

permissions:
 id-token: write
 contents: read

env:
 PACKAGE_TYPE: npm
 ACCESS_LEVEL: rw 

jobs:
 test-auth:
  runs-on: ubuntu-latest
  steps:
   - name: Checkout code
    uses: actions/checkout@v4

   - name: Authenticate with JFrog OIDC
    uses: hpe-cds/reusable-actions/.github/actions/jfrog-oidc-auth@CDSDO-12300
    with:
     jfrog-url: https://hpecds.jfrog.io
     oidc-provider: generic-oidc
     package-type: ${{ env.PACKAGE_TYPE }}
     access-level: ${{ env.ACCESS_LEVEL }}

   - name: Debug Access Token
    run: |
     echo "Access token retrieved:"
     echo "::add-mask::$JFROG_ACCESS_TOKEN"
     echo "${JFROG_ACCESS_TOKEN:0:10}..."

   - name: Decode GitHub OIDC Token
    run: |
     echo "$OIDC_TOKEN" | cut -d '.' -f2 | base64 -d | jq .
    env:
     OIDC_TOKEN: ${{ env.OIDC_TOKEN }}
